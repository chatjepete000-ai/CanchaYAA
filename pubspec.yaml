name: cancha_ya
description: "CanchaYA - organización de equipos, torneos y partidos."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  qr_flutter: ^4.1.0
  image_picker: ^1.2.4
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2
  firebase_app_installations: 0.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/auth/
    - assets/images/home/